<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сопло Лаваля — OpenFOAM</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><section class="visual nozzle" aria-label="Схема сопла"><div class="nozzle-shape">→ ◀▶ →</div></section><section class="content"><p class="eyebrow">Лабораторная работа №7</p><h1>Сопло Лаваля</h1><p class="lede">Параметрическое построение и реальный запуск OpenFOAM.</p><form id="form"><div class="inputs"><label>Давление на входе, Па<input name="pInput" type="number" value="200000" required></label><label>Температура на входе, K<input name="tInput" type="number" value="1800" required></label><label>Давление на выходе, Па<input name="pOutput" type="number" value="9000" required></label><label>Массовый расход, кг/с<input name="massFlow" type="number" step="0.1" value="1.5" required></label><label>Угол входной части, °<input name="alpha" type="number" value="14" required></label><label>Угол выходной части, °<input name="beta" type="number" value="28" required></label></div><button type="submit">Рассчитать сопло</button></form><div id="status" class="status">Готово к запуску</div><img id="result" class="result" alt="Поле давления, полученное OpenFOAM и ParaView" hidden><pre id="log" hidden></pre></section></main><script src="app.js"></script></body></html>
